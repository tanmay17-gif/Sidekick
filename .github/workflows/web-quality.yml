name: web-quality

# Scoped to the browser client (Agent 3).
# Agent 4 owns the repository-wide merge gate; this workflow is intentionally
# self-contained so it can be folded into the main gate without conflict.

on:
  push:
    branches: [main, 'agent3/**']
    paths:
      - 'web/**'
      - '.github/workflows/web-quality.yml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web-quality.yml'

concurrency:
  group: web-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, types, unit and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  e2e:
    name: browser end-to-end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
