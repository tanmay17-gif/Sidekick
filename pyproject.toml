# Project wide build configuration.
#
# Agent 1 owns this file. Agent 2's execution service and Agent 3's browser
# client live in the same repository, so this file covers all of them: the
# Python packages are declared here, the browser client has its own
# `web/package.json`.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sidekick"
version = "0.1.0"
description = "Sidekick - voice-first intelligent companion: core brain, execution service and browser client."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
# Real decision model. Heavy (torch + ~800MB checkpoint) and optional on purpose:
# the core must stay testable without model weights or network access.
laya = ["laya>=0.4", "torch>=2.0"]
# AWS Bedrock decision model, boto3 runtime, and Alexa request verification extras.
aws = [
    "boto3>=1.34",
    "ask-sdk-core>=1.19",
    "ask-sdk-webservice-support>=1.3",
    "cryptography>=42.0",
]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
sidekick = "sidekick.api.app:main"
sidekick-execution = "sidekick_execution.__main__:main"

[tool.setuptools.packages.find]
# Both Python distributions of this project: the core brain and the
# execution service. `scripts/check_packaging.py` verifies that a built
# wheel really contains both.
include = ["sidekick*", "sidekick_execution*"]

[tool.setuptools.package-data]
sidekick = ["api/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
