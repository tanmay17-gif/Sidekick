[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sidekick"
version = "0.1.0"
description = "Sidekick - voice-first intelligent companion: core brain, intent resolution, safety policy, session orchestration and real execution."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
# Real decision model. Heavy (torch + ~800MB checkpoint) and optional on purpose:
# the core must stay testable without model weights or network access.
laya = ["laya>=0.4", "torch>=2.0"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
sidekick = "sidekick.api.app:main"
sidekick-execution = "sidekick_execution.__main__:main"

[tool.setuptools.packages.find]
include = ["sidekick*", "sidekick_execution*"]

[tool.setuptools.package-data]
sidekick = ["api/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

# NOTE (Agent 2): the execution service (sidekick_execution) is implemented on
# the standard library only and therefore adds no runtime dependency. The
# dependency list above stays exactly as Agent 1 defined it.
